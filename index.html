<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OperatorSim - NFC Admin</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b1020;
    color: #fff;
    min-height: 100vh;
}

header {
    background: #121a30;
    padding: 18px 25px;
    border-bottom: 1px solid #26304b;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.badge {
    background: #1c7c54;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #9ca8c7;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: #121a30;
    border: 1px solid #26304b;
    border-radius: 16px;
    padding: 22px;
}

.card h2 {
    margin-bottom: 18px;
    font-size: 19px;
}

.nfc-box {
    border: 2px dashed #405071;
    border-radius: 14px;
    padding: 35px 20px;
    text-align: center;
    margin-bottom: 15px;
}

.nfc-icon {
    font-size: 55px;
    margin-bottom: 12px;
}

.status {
    color: #9ca8c7;
    margin: 10px 0 20px;
    min-height: 20px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 9px;
}

button:hover {
    background: #1d4ed8;
}

.demo {
    background: #374151;
}

.demo:hover {
    background: #4b5563;
}

.danger {
    background: #b91c1c;
}

.danger:hover {
    background: #991b1b;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    margin-bottom: 13px;
    border-radius: 9px;
    border: 1px solid #34405e;
    background: #0b1020;
    color: white;
}

label {
    color: #aeb8d0;
    font-size: 13px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.info-item {
    background: #0b1020;
    padding: 13px;
    border-radius: 9px;
}

.info-item span {
    display: block;
    color: #8793b0;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-item strong {
    font-size: 14px;
}

.log {
    margin-top: 20px;
    background: #080c17;
    border-radius: 10px;
    padding: 14px;
    max-height: 180px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    color: #8ee0b6;
}

@media(max-width: 750px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">📡 OperatorSim</div>
    <div class="badge">DEMO / SIMULATION</div>
</header>

<div class="container">

    <h1>Operatör Yönetim Paneli</h1>
    <p class="subtitle">
        NFC destekli demo müşteri kartı yönetim sistemi
    </p>

    <div class="grid">

        <!-- NFC PANEL -->
        <div class="card">

            <h2>📲 NFC Kart Okuyucu</h2>

            <div class="nfc-box">
                <div class="nfc-icon">📡</div>
                <p>Kartınızı cihazın NFC alanına yaklaştırın</p>
                <div class="status" id="nfcStatus">
                    NFC başlatılmadı
                </div>
            </div>

            <button onclick="startNFC()">
                NFC Okumayı Başlat
            </button>

            <button class="demo" onclick="loadDemoCard()">
                Demo Kartı Tara
            </button>

            <div class="log" id="log">
                Sistem hazır...
            </div>

        </div>

        <!-- CUSTOMER -->
        <div class="card">

            <h2>👤 Demo Müşteri</h2>

            <div class="info">

                <div class="info-item">
                    <span>Müşteri ID</span>
                    <strong id="customerId">-</strong>
                </div>

                <div class="info-item">
                    <span>Ad Soyad</span>
                    <strong id="customerName">-</strong>
                </div>

                <div class="info-item">
                    <span>Hat</span>
                    <strong id="phone">-</strong>
                </div>

                <div class="info-item">
                    <span>Tarife</span>
                    <strong id="package">-</strong>
                </div>

            </div>

            <br>

            <label>Tarife Değiştir</label>
            <select id="packageSelect">
                <option>Demo 20 GB</option>
                <option>Demo 50 GB</option>
                <option>Demo 100 GB</option>
                <option>Sınırsız Demo</option>
            </select>

            <button onclick="changePackage()">
                Tarife Değiştir
            </button>

            <button onclick="addInternet()">
                + 10 GB Demo İnternet
            </button>

            <button class="danger" onclick="resetCustomer()">
                Müşteriyi Sıfırla
            </button>

        </div>

    </div>

</div>

<script>

let customer = null;

/* LOG */
function log(message) {
    const box = document.getElementById("log");

    const time = new Date().toLocaleTimeString();

    box.innerHTML +=
        `<div>[${time}] ${message}</div>`;

    box.scrollTop = box.scrollHeight;
}

/* MÜŞTERİ EKRANA YAZ */
function displayCustomer(data) {

    customer = data;

    document.getElementById("customerId").textContent =
        data.id || "-";

    document.getElementById("customerName").textContent =
        data.name || "-";

    document.getElementById("phone").textContent =
        data.phone || "-";

    document.getElementById("package").textContent =
        data.package || "-";

    log("Demo müşteri bilgileri yüklendi.");
}

/* DEMO KART */
function loadDemoCard() {

    const demoCard = {
        id: "DEMO-48291",
        name: "Demo Kullanıcı",
        phone: "05XX XXX XX XX",
        package: "Demo 50 GB"
    };

    displayCustomer(demoCard);

    document.getElementById("nfcStatus").textContent =
        "Demo kart başarıyla okundu.";

    log("Demo NFC kartı simüle edildi.");
}

/* NFC */
async function startNFC() {

    if (!("NDEFReader" in window)) {

        document.getElementById("nfcStatus").textContent =
            "Bu tarayıcı Web NFC desteklemiyor.";

        log("Web NFC desteklenmiyor. Demo Kartı Tara kullanılabilir.");

        return;
    }

    try {

        const ndef = new NDEFReader();

        await ndef.scan();

        document.getElementById("nfcStatus").textContent =
            "NFC aktif. Demo kartı yaklaştırın.";

        log("NFC okuyucu başlatıldı.");

        ndef.onreadingerror = () => {
            log("NFC okuma hatası.");
        };

        ndef.onreading = ({ message }) => {

            log("NFC etiketi algılandı.");

            for (const record of message.records) {

                try {

                    const decoder = new TextDecoder(
                        record.encoding || "utf-8"
                    );

                    const text = decoder.decode(record.data);

                    log("NFC verisi alındı.");

                    /*
                     * DEMO FORMAT:
                     *
                     * {
                     *   "id":"DEMO-123",
                     *   "name":"Demo Kullanıcı",
                     *   "phone":"05XX XXX XX XX",
                     *   "package":"Demo 20 GB"
                     * }
                     */

                    const data = JSON.parse(text);

                    displayCustomer(data);

                    document.getElementById("nfcStatus").textContent =
                        "Demo kart başarıyla okundu.";

                } catch (error) {

                    log("NFC verisi geçerli demo JSON formatında değil.");

                }
            }
        };

    } catch (error) {

        log("NFC başlatılamadı: " + error.message);

        document.getElementById("nfcStatus").textContent =
            "NFC başlatılamadı.";
    }
}

/* TARİFE DEĞİŞTİR */
function changePackage() {

    if (!customer) {
        alert("Önce demo kart okutun.");
        return;
    }

    const selected =
        document.getElementById("packageSelect").value;

    customer.package = selected;

    document.getElementById("package").textContent =
        selected;

    log("Demo tarife değiştirildi: " + selected);
}

/* İNTERNET EKLE */
function addInternet() {

    if (!customer) {
        alert("Önce demo kart okutun.");
        return;
    }

    log("Demo müşteriye +10 GB internet tanımlandı.");

    alert("Demo işlem başarılı!\n+10 GB internet eklendi.");
}

/* SIFIRLA */
function resetCustomer() {

    customer = null;

    document.getElementById("customerId").textContent = "-";
    document.getElementById("customerName").textContent = "-";
    document.getElementById("phone").textContent = "-";
    document.getElementById("package").textContent = "-";

    document.getElementById("nfcStatus").textContent =
        "NFC başlatılmadı";

    log("Müşteri ekranı temizlendi.");
}

</script>

</body>
</html>
